# Cella Nginx reverse-proxy (production)
#
# Uso:
#   cp cella.conf /etc/nginx/sites-available/cella
#   ln -s /etc/nginx/sites-available/cella /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# TLS: usa certbot (Let's Encrypt) con el plugin nginx:
#   certbot --nginx -d cella.ai -d www.cella.ai

server {
    listen 80;
    listen [::]:80;
    server_name cella.ai www.cella.ai;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cella.ai www.cella.ai;

    # ── TLS ──
    ssl_certificate     /etc/letsencrypt/live/cella.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cella.ai/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/cella.ai/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ── Security headers (complementa los de FastAPI) ──
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer" always;

    # ── Gzip ──
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # ── Static / Frontend (Next.js) ──
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 120s;
    }

    # ── API (FastAPI) ──
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 300s;

        # Strip /api prefix so /api/documents → /documents
        # (already stripped by trailing / in proxy_pass)
    }

    # ── SSE (streaming de chat) ──
    location /api/chat/ {
        proxy_pass http://127.0.0.1:8000/chat/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
    }

    # ── Metrics (internal-only) ──
    location /metrics {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:8000/metrics;
        proxy_set_header Host $host;
    }

    # ── Health check ──
    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
    }
}